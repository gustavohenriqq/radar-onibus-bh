# Sem segredo: Spark local, dentro do conteiner, gravando no disco da VM.
radar:
  target: vm
  outputs:
    vm:
      type: spark
      method: session
      host: NA
      schema: gold
      threads: 1
      server_side_parameters:
        spark.master: "local[*]"
        spark.driver.memory: "8g"
        spark.jars.packages: "io.delta:delta-spark_4.2_2.13:4.4.1"
        spark.sql.extensions: "io.delta.sql.DeltaSparkSessionExtension"
        spark.sql.catalog.spark_catalog: "org.apache.spark.sql.delta.catalog.DeltaCatalog"
        # Tudo em UTC, como na Silver. BH so entra de forma explicita.
        spark.sql.session.timeZone: "UTC"
        spark.sql.shuffle.partitions: "32"
        spark.sql.warehouse.dir: "/app/dados/gold/_warehouse"
        spark.driver.extraJavaOptions: "-Dderby.system.home=/app/dados/gold/_metastore"
        spark.ui.enabled: "false"
