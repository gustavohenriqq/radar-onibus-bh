version: 2

models:
  - name: stg_posicoes
    description: Posicoes da Silver dentro da regiao de BH, a partir do primeiro dia cheio.
    data_tests:
      - combinacao_unica:
          arguments:
            colunas: [vehicle_id, vehicle_ts]
    columns:
      - name: vehicle_id
        data_tests: [not_null]
      - name: vehicle_ts
        data_tests: [not_null]
      - name: data_bh
        data_tests: [not_null]
      - name: route_id
        data_tests: [not_null]
      - name: direction_id
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: letreiro
        data_tests: [not_null]
      - name: stop_sequence
        data_tests: [not_null]
      - name: stop_id
        data_tests: [not_null]
